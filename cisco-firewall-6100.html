const camera=new THREE.PerspectiveCamera(35,1,0.1,100);
camera.position.set(4.5,2.4,5.8);
const controls=new THREE.OrbitControls(camera,canvas);
controls.enableDamping=true;controls.autoRotate=true;controls.autoRotateSpeed=1.2;
controls.minDistance=2;controls.maxDistance=14;
scene.add(new THREE.HemisphereLight(0xffffff,0x888899,0.9));
const key=new THREE.DirectionalLight(0xffffff,0.8);key.position.set(3,5,4);scene.add(key);
const fill=new THREE.DirectionalLight(0xffffff,0.35);fill.position.set(-4,2,-3);scene.add(fill);
// 2RU chassis: front ~4.9:1, deep body
const W=4.4,H=0.89,D=6.0;
const tex=new THREE.TextureLoader().load(FRONT);
tex.encoding=THREE.sRGBEncoding;tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
const metal=new THREE.MeshStandardMaterial({color:0xd2d3d6,metalness:0.45,roughness:0.5});
const back=new THREE.MeshStandardMaterial({color:0x6a6d72,metalness:0.3,roughness:0.7});
const front=new THREE.MeshStandardMaterial({map:tex,metalness:0.1,roughness:0.6});
// box face order: +x,-x,+y,-y,+z(front),-z(back)
const box=new THREE.Mesh(new THREE.BoxGeometry(W,H,D),[metal,metal,metal,metal,front,back]);
box.position.z=-D/2+0.4;
const g=new THREE.Group();g.add(box);scene.add(g);

controls.target.set(0,0,box.position.z/2);
function size(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',size);size();
canvas.addEventListener('pointerdown',()=>controls.autoRotate=false);
(function loop(){controls.update();renderer.render(scene,camera);requestAnimationFrame(loop);})();
</script></body></html>
